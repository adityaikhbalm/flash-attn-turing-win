name: build-windows-wheel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout upstream (pinned commit)
        uses: actions/checkout@v4
        with:
          repository: ssiu/flash-attention-turing
          ref: 9ef98fcb506bb1e2fe3cece50935e2935bf6b124
          submodules: recursive
          fetch-depth: 1
          path: src

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Disk before
        shell: pwsh
        run: Get-PSDrive C | Select-Object Used, Free

      - name: Install CUDA 12.8
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.8.0"
          method: network

      - name: Install build dependencies and pinned torch
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel ninja
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; print('torch', torch.__version__, 'cuda', torch.version.cuda)"

      - name: Toolchain info
        shell: pwsh
        run: |
          Write-Host "CUDA_PATH=$env:CUDA_PATH"
          nvcc --version
          where.exe nvcc
          Get-PSDrive C | Select-Object Used, Free

      - name: Build wheel
        shell: pwsh
        working-directory: src
        run: |
          python -m pip wheel . --no-build-isolation --no-deps -w ../dist
          Get-ChildItem ../dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: flash-attn-turing-win-cp313
          path: dist/*.whl
          if-no-files-found: error
